[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "zapostit-api"
version = "0.2.0"
description = "Typed Python client for zapostit.com"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "yaroslav" },
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
]

[project.urls]
Repository = "https://github.com/yar2slav/zapostit-api"
Documentation = "https://github.com/yar2slav/zapostit-api#readme"
Issues = "https://github.com/yar2slav/zapostit-api/issues"

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zapostit"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
allowed-confusables = ["с", "о"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
packages = ["zapostit"]
mypy_path = "src"
